name: 检查与发布
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.317'
      - name: 安装 pnpm
        run: npm install --global pnpm@12.3.4
      - name: 检查前端
        working-directory: webui
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build
      - name: 测试后端
        run: dotnet test Jellyfin.SubtitlesTool.sln --nologo
      - name: 创建安装包
        shell: pwsh
        run: ./scripts/package.ps1
      - name: 发布
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $manifest = Get-Content artifacts/manifest.json -Raw | ConvertFrom-Json
          $version = $manifest[0].versions[0].version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw '标签与插件版本不一致' }
          gh release create $env:GITHUB_REF_NAME "artifacts/jav-jellyfin-subtitles-tool_$version.zip" --title $env:GITHUB_REF_NAME --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release 发布失败' }
          git fetch origin main
          git checkout -B main origin/main
          Copy-Item -LiteralPath artifacts/manifest.json -Destination manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "发布 $version 插件清单"; git push origin main }
